<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f0e8">
  <title>PLAYGROUND — Game Archive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --paper: #f3f0e8;
      --ink: #24251f;
      --muted: #77776d;
      --line: #24251f;
      --yellow: #f4d35e;
      --blue: #a9c7d8;
      --pink: #e9aaa0;
      --green: #b9c9a8;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Black Han Sans", "Malgun Gothic", sans-serif;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    a { color: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--line);
      font: 700 12px "Space Mono", monospace;
      letter-spacing: .08em;
    }

    .topbar-mark {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 2px solid var(--ink);
      background: var(--yellow);
      font-size: 14px;
    }

    .topbar-note {
      color: var(--muted);
      text-align: right;
    }

    .hero {
      position: relative;
      padding: clamp(54px, 10vw, 112px) 0 62px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 10px;
      border: 2px solid var(--ink);
      background: var(--yellow);
      font: 700 11px "Space Mono", monospace;
      letter-spacing: .08em;
      transform: rotate(-2deg);
    }

    h1 {
      max-width: 800px;
      margin: 0;
      font-size: clamp(58px, 11vw, 120px);
      line-height: .88;
      letter-spacing: -.055em;
    }

    h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2px var(--ink);
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-top: 32px;
    }

    .hero-copy {
      max-width: 440px;
      margin: 0;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.7;
      word-break: keep-all;
    }

    .hero-stamp {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 105px;
      height: 105px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--pink);
      font: 700 12px/1.5 "Space Mono", monospace;
      text-align: center;
      transform: rotate(9deg);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin: 0 0 18px;
      padding-top: 18px;
      border-top: 2px solid var(--ink);
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(25px, 4vw, 36px);
    }

    .count {
      font: 700 12px "Space Mono", monospace;
      color: var(--muted);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .game-card {
      --card-color: var(--yellow);
      position: relative;
      display: flex;
      min-height: 310px;
      flex-direction: column;
      padding: 20px;
      border: 2px solid var(--ink);
      background: var(--card-color);
      text-decoration: none;
      box-shadow: 5px 5px 0 var(--ink);
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }

    .game-card:nth-child(3n + 2) {
      --card-color: var(--blue);
    }

    .game-card:nth-child(3n) {
      --card-color: var(--green);
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 var(--ink);
      outline: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 700 11px "Space Mono", monospace;
    }

    .game-number {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .game-icon {
      display: grid;
      place-items: center;
      flex: 1;
      min-height: 112px;
      font-family: sans-serif;
      font-size: clamp(55px, 7vw, 76px);
      filter: grayscale(.1);
    }

    .game-title {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 31px);
      line-height: 1.1;
    }

    .game-description {
      min-height: 48px;
      margin: 0 0 18px;
      font-family: "Malgun Gothic", sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.65;
      word-break: keep-all;
    }

    .card-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
      border-top: 2px solid var(--ink);
      font: 700 11px "Space Mono", monospace;
      letter-spacing: .04em;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 17px;
      transition: transform .18s ease;
    }

    .game-card:hover .arrow {
      transform: rotate(45deg);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 46px;
      padding-top: 15px;
      border-top: 2px solid var(--ink);
      color: var(--muted);
      font: 700 10px "Space Mono", monospace;
      letter-spacing: .05em;
    }

    @media (max-width: 800px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .game-card {
        min-height: 290px;
      }
    }

    @media (max-width: 540px) {
      .page {
        width: min(100% - 28px, 420px);
        padding-top: 18px;
      }

      .topbar {
        font-size: 10px;
      }

      .hero {
        padding: 68px 0 48px;
      }

      .hero-bottom {
        align-items: start;
      }

      .hero-stamp {
        width: 76px;
        height: 76px;
        font-size: 9px;
      }

      .game-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .game-card {
        min-height: 260px;
        padding: 18px;
      }

      .game-icon {
        min-height: 88px;
        font-size: 62px;
      }

      .game-description {
        min-height: 0;
      }

      .footer {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="topbar-mark">
        <span class="mark">✳</span>
        EVERAIN / GAME ARCHIVE
      </div>
      <div class="topbar-note">
        A SMALL COLLECTION OF PLAYABLE THINGS
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow">WELCOME TO MY PLAYGROUND</div>
      <h1>LET'S<br><span>PLAY!</span></h1>

      <div class="hero-bottom">
        <p class="hero-copy">
          직접 만든 작은 게임들을 모아 둔 공간입니다.<br>
          마음에 드는 게임을 골라 자유롭게 플레이해 보세요.
        </p>
        <div class="hero-stamp">PRESS<br>START<br>↘</div>
      </div>
    </section>

    <section aria-labelledby="games-heading">
      <div class="section-head">
        <h2 id="games-heading">GAME SELECT</h2>
        <span class="count" id="game-count">03 GAMES</span>
      </div>

      <div class="game-grid" id="game-grid">
        <!-- 게임 카드는 JavaScript에서 자동으로 만들어집니다. -->
      </div>
    </section>

    <footer class="footer">
      <span>EVERAIN'S GAME ARCHIVE</span>
      <span>MORE GAMES WILL BE ADDED SOON — THANKS FOR PLAYING!</span>
    </footer>
  </main>

  <script>
    /*
      새 게임을 추가하는 방법:
      1. 아래 games 배열에 항목을 하나 복사합니다.
      2. title, description, icon, url을 수정합니다.
      3. 쉼표(,)를 빠뜨리지 않도록 주의하세요.
    */

    const games = [
      {
        title: "운석 피하기",
        description: "떨어지는 운석과 UFO를 피하고 특별한 별을 모아 보세요.",
        icon: "☄️",
        url: "https://everain00.github.io/everain-vibecoding/game/game1.html"
      },
      {
        title: "두더지 잡기",
        description: "제한 시간 30초! 두더지를 잡고 최고 기록에 도전하세요.",
        icon: "🐹",
        url: "https://everain00.github.io/everain-vibecoding/game/game2.html"
      },
      {
        title: "기억력 테스트",
        description: "카드를 뒤집어 같은 그림을 찾아 모든 짝을 맞춰 보세요.",
        icon: "🃏",
        url: "https://everain00.github.io/everain-vibecoding/game/game3.html"
      },
      {
        title: "등반 게임",
        description: "정상까지 올라 보세요.",
        icon: "🧗",
        url: "https://everain00.github.io/everain-vibecoding/game/game3.html"
      }
    ];

    const gameGrid = document.getElementById("game-grid");
    const gameCount = document.getElementById("game-count");

    function renderGames() {
      gameGrid.innerHTML = "";

      games.forEach((game, index) => {
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = game.url;
        card.setAttribute("aria-label", `${game.title} 게임 시작`);

        const number = String(index + 1).padStart(2, "0");

        card.innerHTML = `
          <div class="card-top">
            <span class="game-number">${number}</span>
            <span>GAME / ${number}</span>
          </div>

          <div class="game-icon" aria-hidden="true">${game.icon}</div>

          <h3 class="game-title"></h3>
          <p class="game-description"></p>

          <div class="card-link">
            <span>PLAY GAME</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </div>
        `;

        card.querySelector(".game-title").textContent = game.title;
        card.querySelector(".game-description").textContent = game.description;

        gameGrid.appendChild(card);
      });

      gameCount.textContent =
        `${String(games.length).padStart(2, "0")} GAMES`;
    }

    renderGames();
  </script>
</body>
</html>
